<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>邓氏世系树形图 · 南阳堂</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --paper:#f2ede0;
  --paper2:#f8f4ea;
  --ink:#28241c; --ink2:#54493a;
  --seal:#a3312a; --seal2:#7c231e;
  --bronze:#8a6a33;
  --line:#c3a96f; --line2:#ddd0a8;
  --card:#fffdf7;
  --shadow:rgba(40,36,28,.1);
  --NW:90px; --NH:108px;
}
body{
  background:var(--paper);
  font-family:"Noto Serif SC",serif;
  color:var(--ink);
  overflow:hidden;height:100vh;width:100vw;
  /* subtle map texture */
  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(180,200,140,.18) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(220,200,140,.15) 0%, transparent 45%),
    radial-gradient(ellipse at 60% 20%, rgba(200,220,180,.1) 0%, transparent 40%);
}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:50px;
  background:rgba(242,237,224,.95);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:10px;padding:0 16px;
}
.brand{font-family:"Ma Shan Zheng",cursive;font-size:19px;color:var(--seal);white-space:nowrap;}
.topbar-gap{flex:1;}
.era-pills{display:flex;gap:3px;overflow-x:auto;max-width:600px;}
.era-pills::-webkit-scrollbar{display:none;}
.epill{
  font-size:11px;padding:3px 8px;border-radius:20px;
  border:1px solid var(--line2);background:rgba(255,252,240,.6);
  cursor:pointer;color:var(--ink2);white-space:nowrap;flex:none;
  transition:all .12s;
}
.epill.on{background:var(--seal);color:#fff;border-color:var(--seal);}
.tbtn{
  font-size:12px;color:var(--ink2);
  border:1px solid var(--line2);background:rgba(255,252,240,.7);
  padding:4px 10px;border-radius:2px;cursor:pointer;white-space:nowrap;
  text-decoration:none;flex:none;
}
.tbtn:hover{color:var(--seal);}
.search-wrap{position:relative;flex:none;}
.sinput{
  font-family:inherit;font-size:12.5px;padding:4px 8px;
  border:1px solid var(--line2);background:rgba(255,252,240,.8);
  color:var(--ink);width:110px;border-radius:2px;
}
.sinput:focus{outline:none;border-color:var(--bronze);}

/* ── CANVAS ── */
#canvas{
  position:fixed;top:50px;left:0;right:0;bottom:0;
  overflow:scroll;cursor:grab;
  -webkit-overflow-scrolling:touch;
}
#canvas.grabbing{cursor:grabbing;}
#world{position:relative;transform-origin:0 0;}

/* ── GEN LABEL (left sidebar) ── */
.glabel{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
  width:36px;
  font-size:11px;color:var(--bronze);
  font-family:"Ma Shan Zheng",cursive;
  writing-mode:vertical-lr;letter-spacing:1px;
  opacity:.7;pointer-events:none;
}

/* ── NODE ── */
.node{
  position:absolute;
  width:90px;
  text-align:center;
  cursor:pointer;
  transition:filter .15s;
  z-index:3;
}
.node:hover{filter:brightness(1.06);z-index:20;}
.node:hover .ncard{box-shadow:0 4px 16px rgba(163,49,42,.18);}
.node.highlighted .ncard{
  box-shadow:0 0 0 2.5px var(--seal),0 4px 14px rgba(163,49,42,.2);
}
.node.dimmed{opacity:.15;pointer-events:none;}

/* avatar */
.avatar{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--line);
  background:var(--card);
  margin:0 auto 5px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px var(--shadow);
  overflow:hidden;position:relative;
}
.avatar svg{width:34px;height:34px;color:#c0b8a8;}
.node.ml .avatar{border-color:var(--seal);background:#fff8f6;}
.node.ml .avatar svg{color:#c88;}

/* card */
.ncard{
  background:var(--card);
  border:1.5px solid var(--line2);
  border-radius:6px;
  padding:5px 5px 6px;
  box-shadow:0 2px 8px var(--shadow);
  position:relative;
  transition:box-shadow .15s;
}
.node.ml .ncard{border-color:var(--seal);border-width:2px;}
.node.ml .ncard::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:3px;background:var(--seal);border-radius:4px 4px 0 0;
}
.nname{
  font-size:13.5px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.node.ml .nname{color:var(--seal2);}
.nera{font-size:9.5px;color:var(--ink2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nrank{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:#fff;background:var(--bronze);
  padding:1px 5px;border-radius:20px;white-space:nowrap;
  pointer-events:none;
}
.nseq{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  font-size:9px;color:var(--ink2);background:var(--line2);
  padding:0px 5px;border-radius:20px;white-space:nowrap;
  pointer-events:none;
}

/* ── CONNECTORS (SVG) ── */
#svg-layer{
  position:absolute;top:0;left:0;
  pointer-events:none;z-index:1;
}

/* ── DETAIL PANEL ── */
#dp{
  position:fixed;right:-400px;top:50px;bottom:0;width:380px;
  background:var(--card);
  border-left:1px solid var(--line);
  box-shadow:-6px 0 24px rgba(40,36,28,.12);
  transition:right .22s ease;z-index:300;
  overflow-y:auto;padding:22px 20px 40px;
}
#dp.open{right:0;}
.dp-x{
  position:sticky;top:0;float:right;
  font-size:22px;color:var(--ink2);cursor:pointer;
  border:none;background:none;line-height:1;padding:0 4px;
  font-family:sans-serif;z-index:10;
}
.dp-seq{font-size:11px;color:var(--bronze);margin-bottom:3px;letter-spacing:.1em;}
.dp-name{font-size:26px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.dp-rank{font-size:13px;color:var(--seal);margin-bottom:10px;}
.dp-era{display:inline-block;font-size:12px;color:#fff;
  padding:2px 10px;border-radius:2px;margin-bottom:14px;}
.dp-sect{margin-bottom:14px;}
.dp-stitle{font-size:11px;color:var(--bronze);letter-spacing:.06em;
  border-bottom:1px solid var(--line2);padding-bottom:3px;margin-bottom:8px;}
.dp-bio{font-size:13.5px;color:var(--ink2);line-height:1.9;}
.dp-tag{display:inline-block;font-size:11.5px;color:var(--bronze);
  border:1px solid var(--line2);padding:2px 7px;border-radius:2px;
  margin:0 4px 4px 0;}

/* ── ZOOM ── */
.zbox{
  position:fixed;bottom:20px;right:20px;z-index:400;
  display:flex;flex-direction:column;gap:4px;
}
.zbtn{
  width:36px;height:36px;background:var(--card);
  border:1px solid var(--line);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:2px;color:var(--ink2);font-family:sans-serif;
  transition:background .1s;user-select:none;
}
.zbtn:hover{background:#ede5cc;color:var(--seal);}

/* ── LEGEND ── */
.legend{
  position:fixed;bottom:20px;left:56px;z-index:400;
  display:flex;align-items:center;gap:14px;
  font-size:11px;color:var(--ink2);
  background:rgba(242,237,224,.88);
  border:1px solid var(--line2);padding:6px 12px;border-radius:4px;
  backdrop-filter:blur(4px);
}
.leg-item{display:flex;align-items:center;gap:4px;}
.leg-box{width:12px;height:12px;border-radius:2px;flex:none;}

@media(max-width:640px){
  .era-pills{display:none;}
  #dp{width:100%;right:-100%;}
  .legend{display:none;}
  .sinput{width:80px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">邓氏世系树</div>
  <div class="era-pills" id="epills"></div>
  <div class="topbar-gap"></div>
  <div class="search-wrap">
    <input class="sinput" id="sinput" placeholder="搜索先祖…" oninput="doSearch(this.value)">
  </div>
  <button class="tbtn" onclick="resetView()">重置</button>
  <a href="邓氏渊源族谱.html" class="tbtn">← 返回族谱</a>
</div>

<div id="canvas">
  <div id="world">
    <svg id="svg-layer"></svg>
  </div>
</div>

<div id="dp">
  <button class="dp-x" onclick="closePanel()">×</button>
  <div id="dp-body"></div>
</div>

<div class="zbox">
  <button class="zbtn" onclick="doZoom(1.2)" title="放大">＋</button>
  <button class="zbtn" onclick="doZoom(0.83)" title="缩小">－</button>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-box" style="background:var(--seal);border:2px solid var(--seal2);"></div>主线传承</div>
  <div class="leg-item"><div class="leg-box" style="background:var(--card);border:1.5px solid var(--line2);"></div>旁系分支</div>
  <div class="leg-item" style="color:#aaa;font-size:10px;">拖拽平移 · 滚轮缩放</div>
</div>

<script id="td" type="application/json">[{"seq": 1, "name": "少典", "era": "", "rank": "", "bio": "黄帝者，少典之子，姓公孙，名曰轩辕。黄帝二十五子，其得姓者十四人。", "tags": [], "children_names": []}, {"seq": 2, "name": "黄帝（轩辕氏）", "era": "三皇", "rank": "", "bio": "黄帝号轩辕。少典之子,母曰附保视有大电绕北斗星而有孕,二十五月而生帝于寿丘,熊氏部落首领,长姬水故姓姬。约四千多年前,居西北高原,后分路东进,在陂泉一战打败炎帝,遂合并为一,并力合战,在汤鹿之野击败九黎族,擒杀蚩尤,被尊为炎黄部落联盟之首领", "tags": ["昌意"], "children_names": ["其一玄嚣", "是为青阳"]}, {"seq": 3, "name": "玄器", "era": "颛顼", "rank": "", "bio": "", "tags": [], "children_names": []}, {"seq": 4, "name": "蟜极", "era": "鲧", "rank": "", "bio": "帝喾高辛者，黄帝之曾孙也。高辛父曰蟜极，蟜极父曰玄嚣，玄嚣父曰黄帝。自玄嚣与蟜极皆不得在位，至高辛即帝位。高辛于颛顼为族子。", "tags": ["穷蝉"], "children_names": []}, {"seq": 5, "name": "帝喾（高辛）", "era": "禹（夏祖）", "rank": "", "bio": "", "tags": ["后稷（周祖）", "挚"], "children_names": []}, {"seq": 6, "name": "契（商祖，子氏）", "era": "商祖", "rank": "", "bio": "《史记》殷契，母曰简狄，有娀氏之女，为帝喾次妃。三人行浴，见玄鸟堕其卵，简狄取吞之，因孕生契。契长而佐禹治水有功。帝舜乃命契曰：“百姓不亲，五品不训，汝为司徒而敬敷五教，五教在宽。”封于商，赐姓子氏。契兴於唐、虞、大禹之际，功业著於百姓，百", "tags": ["契最早建都今天山东曹县，然后搬到蕃（今天山东藤县）"], "children_names": []}, {"seq": 7, "name": "昭明", "era": "商祖", "rank": "", "bio": "昭明，契玄王生,居于砥石迁于商,十有(又)四世乃有天乙是成汤。契卒，昭明立。商朝先祖。", "tags": [], "children_names": []}, {"seq": 8, "name": "相土", "era": "昭明的儿子又搬到泰山、再搬回商都", "rank": "", "bio": "相土，子姓，名相土。契之孙，昭明之子，昌若之父。商民族的第三任首领。昭明卒、子相土立,迁都泰山建东都、与缯相邻。相土身材高大、体质健壮、在带领氏族民众狩猎时，常与野马、野猪、大象、猛虎、凶狼等野兽搏斗，并经常将各种野兽打死或制服。长期与野兽", "tags": [], "children_names": []}, {"seq": 9, "name": "昌若", "era": "昭明的儿子又搬到泰山、再搬回商都", "rank": "", "bio": "昌若，子姓，名昌若。契之後，相土之子，曹圉之父。商民族的第四任首領。", "tags": [], "children_names": []}, {"seq": 10, "name": "曹圉", "era": "昭明的儿子又搬到泰山、再搬回商都", "rank": "", "bio": "曹圉，子姓，名曹圉，一名粮圉。契之后，昌若之子，冥之父，商汤的九世祖。商民族的第五任首领。虽然司马迁著《史记·殷本纪》时，有提到他，不过没有描述其的事迹。祖父相土在夏相在位时，为了驯养马匹，而制作乘马。昌若死后，曹圉继位。曹圉死后，其子冥继", "tags": [], "children_names": []}, {"seq": 11, "name": "冥", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "冥：夏朝时商部落首领，相土的曾孙，曹圉之子，商汤八世祖，子姓，甲骨文中称谓季，其子为王亥和王恒。冥任夏司空，是在大禹之后的又一位治水英雄，任官勤劳，死于水中，后商人以郊祭祭祀。《国语鲁语上》载：冥勤其官而水死。后世之人奉为水神，称之为玄冥。", "tags": [], "children_names": []}, {"seq": 12, "name": "振/王亥（高祖）", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "振，商的开国君主汤的祖先。他是曹圉的孙子，冥的儿子。冥死后，他成为商族首领，子上甲微。", "tags": [], "children_names": []}, {"seq": 13, "name": "上甲微", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "", "tags": ["上甲微，子报乙。"], "children_names": []}, {"seq": 14, "name": "报乙", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "", "tags": ["报乙，子报丙。"], "children_names": []}, {"seq": 15, "name": "报丙", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "", "tags": ["报丙，子报丁。"], "children_names": []}, {"seq": 16, "name": "报丁", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "", "tags": ["报丁，子主壬。"], "children_names": []}, {"seq": 17, "name": "主壬", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "", "tags": ["主壬，子主癸"], "children_names": []}, {"seq": 18, "name": "主癸", "era": "帝芬又迁都到殷（今河南安阳）", "rank": "", "bio": "《史记》契卒，子昭明立。昭明卒，子相土立。相土卒，子昌若立。昌若卒，子曹圉立。曹圉卒，子冥立。冥卒，子振立。振卒，子微立。微卒，子报丁立。报丁卒，子报乙立。报乙卒，子报丙立。报丙卒，子主壬立。主壬卒，子主癸立。主癸卒，子天乙立，是为成汤。", "tags": [], "children_names": []}, {"seq": 19, "name": "成汤（天乙）", "era": "商朝", "rank": "", "bio": "天乙即成汤，主癸之子，自契至汤八迁。汤始居毫，从先王居作《帝誥》。汤是一位英明宽厚仁慈之君，因夏桀无道，兴兵伐桀，放桀南巢（今安徽巢县），于是结束夏朝四百余年之统治，从此开创商代。子三：太丁、外丙、伸壬。", "tags": ["商朝是建都在于亳，现如今是河南商丘"], "children_names": []}, {"seq": 20, "name": "太丁", "era": "商朝", "rank": "", "bio": "太丁天乙之子，成汤崩，太子太丁未立而卒（子二：太甲、太宗），于是乃立太丁之弟外丙，是为帝外丙。帝外丙即位三年崩，立外丙之弟伸壬，是为帝伸壬。伸壬即位四年，崩，伊尹乃立太丁之子太甲。", "tags": [], "children_names": []}, {"seq": 21, "name": "太甲（太宗）", "era": "商朝", "rank": "", "bio": "太甲太丁之子，是为帝太甲，帝太甲既立三年，不明，暴虐，不遵汤法，乱德，于是伊尹放之桐宫，三年，伊尹摄政当国，以朝诸侯。帝太甲居桐宫三年，悔过自责，反善。于是伊尹乃迎帝太甲，而受之政。帝太甲修德，诸侯咸归殷，百姓以宁，伊尹嘉之。", "tags": [], "children_names": []}, {"seq": 22, "name": "太庚", "era": "商朝", "rank": "", "bio": "太太甲之子。帝太甲崩，沃丁立。帝沃丁崩，弟太庚立。帝太庚崩，子小甲立.", "tags": [], "children_names": []}, {"seq": 23, "name": "太戊（中宗）", "era": "商朝", "rank": "", "bio": "太戊太庚之子，接帝位。帝小甲崩，弟雍乙立。是为帝雍乙。殷道衰，诸侯或不至。帝雍乙崩，弟太戊立。帝太戊，伊陟为相，毫有祥桑谷共生与朝，一暮大拱，帝太戊惧,问伊陟。陟曰:“臣闻妖不胜德,帝陟政有阙与?帝其修德”。太戊从陟,而祥桑枯死而去。伊陟赞", "tags": [], "children_names": []}, {"seq": 24, "name": "仲丁", "era": "(公元前1435)", "rank": "", "bio": "郑州商城遗址，为商朝第十位君主仲丁所建的嚣都。位于郑州市区，东起凤凰台、西到西沙口、北至花园路、南达二里岗，面积2500公顷。1950年被发现，1955年在遗址中部又发现一座周长近7公里的城垣。之后经过多次考古发掘，发现了大量的宫殿房基、小", "tags": [], "children_names": []}, {"seq": 25, "name": "祖乙", "era": "商朝", "rank": "", "bio": "祖乙河亶甲之子，帝河亶甲崩，祖乙立，殷复兴，巫贤任职。子二：祖辛、沃甲。", "tags": ["迁都于邢，又迁到庇"], "children_names": []}, {"seq": 26, "name": "沃甲", "era": "商朝", "rank": "", "bio": "祖祖乙之子，祖乙崩，祖辛立。子：祖丁。祖辛崩，弟沃甲立。子：南庚。", "tags": [], "children_names": []}, {"seq": 27, "name": "祖丁/南庚", "era": "商朝", "rank": "", "bio": "祖丁祖辛之子，沃甲崩，祖丁立，是为帝祖丁。子：阳甲、盘庚、小辛、小乙、曼季（邓姓始祖）。祖丁崩，南庚立。", "tags": ["庇迁到奄"], "children_names": []}, {"seq": 28, "name": "曼公（子曼）", "era": "商朝", "rank": "始祖", "bio": "据史籍《元和姓纂》记载，商族的始祖契为子姓，至商高宗武丁执政之初大封诸侯，封他的叔父曼季(子曼，字德阳)于曼城(今河南邓州)，侯爵，史称曼侯，以封邑名称为姓氏，称曼姓；后来，商高宗又在丁巳年(商高宗元年，公元前1374年，断代工程认为是公元", "tags": ["盘庚（迁殷），曼城邓国（河南伊川）", "商朝（公元前1250年）"], "children_names": ["晁"]}, {"seq": 29, "name": "晁公", "era": "商朝", "rank": "二世祖", "bio": "曼公之子。字旻宁，世袭侯爵。妣李氏，封夫人，生子：徽。", "tags": ["邓国（河南偃城东）"], "children_names": []}, {"seq": 30, "name": "徽公", "era": "商朝", "rank": "三世祖", "bio": "晁公之子。字虞，世袭侯爵。妣汪氏，封夫人，生子：庆、耿。", "tags": ["邓国（河南偃城东）"], "children_names": ["庆", "耿"]}, {"seq": 31, "name": "庆公", "era": "商朝", "rank": "四世祖", "bio": "徽公之子。字晃文，世袭侯爵。妣姜氏，封夫人，生子：超、桓。", "tags": ["邓国（河南偃城东）"], "children_names": ["超", "桓"]}, {"seq": 32, "name": "桓公", "era": "商朝", "rank": "五世祖", "bio": "庆公之子。字仁挚，世袭侯爵。妣郑氏，封夫人，生子：昆、仪。", "tags": ["邓国（河南偃城东）"], "children_names": ["昆", "仪"]}, {"seq": 33, "name": "昆公", "era": "西周", "rank": "六世祖", "bio": "桓公之子。因商纣王无道，去殷归周，择主而事，仍封侯爵。妣闻氏，封夫人，生子：忠。", "tags": ["商纣王迁到朝歌（今河南淇县）"], "children_names": []}, {"seq": 34, "name": "忠公", "era": "西周", "rank": "七世祖", "bio": "邓侯曼忠反对商帝辛子受辛的荒淫暴虐，因此站在了周武王姬发一边，支持周武王伐纣的正义之举，因此在西周王朝建立之时，仍保留有侯爵封号，后在周公旦平灭了“三监之乱”后，安排邓国举族南迁至今南阳盆地，是周王朝在南方较为重要的诸侯国之一，其主要的作用", "tags": ["西周\n（公元前1046-前771年）", "邓国（邓州、襄樊）"], "children_names": ["晖吉", "晖文"]}, {"seq": 35, "name": "晖吉公", "era": "西周", "rank": "八世祖", "bio": "", "tags": ["忠公长子。世袭侯爵。妣杨氏，封夫人，生子：日浩。", "邓国（邓州、襄樊）"], "children_names": []}, {"seq": 36, "name": "日浩公", "era": "西周", "rank": "九世祖", "bio": "这一时期的邓国君主为邓辉侯子噶吉，迁址立稳后，他将王族姓氏改回为子姓，与宋国遥相呼应。", "tags": ["邓国（邓州、襄樊）"], "children_names": ["煦和"]}, {"seq": 37, "name": "煦和公", "era": "西周", "rank": "十世祖", "bio": "日浩公长子。世袭侯爵，妣朱氏，封夫人，生子：楠。继配黄氏，封夫人，生子：杞。", "tags": ["邓国（邓州、襄樊）"], "children_names": []}, {"seq": 38, "name": "杞公", "era": "西周", "rank": "十一世祖", "bio": "煦和公次子。世袭侯爵，妣余氏，封夫人，生子：熹珍、朗珍。", "tags": ["邓国（邓州、襄樊）"], "children_names": ["熹珍", "朗珍"]}, {"seq": 39, "name": "熹珍公", "era": "西周", "rank": "十二世祖", "bio": "到了西周中期，邓国君主邓熹侯子朗喜又将国都徙于今湖北省的襄樊市樊城区附近。", "tags": ["邓国（湖北襄樊）"], "children_names": ["怡", "悦"]}, {"seq": 40, "name": "怡公", "era": "西周", "rank": "十三世祖", "bio": "熹珍公长子。世袭侯爵，妣黄氏，封夫人，生子二：淮、沛。", "tags": ["邓国（湖北襄樊）"], "children_names": ["淮", "沛"]}, {"seq": 41, "name": "沛公", "era": "西周", "rank": "十四世祖", "bio": "怡公次子。世袭侯爵，妣姜氏，封夫人，生子二：琮、璧。", "tags": ["邓国（湖北襄樊）"], "children_names": ["琮", "璧"]}, {"seq": 42, "name": "璧公", "era": "西周", "rank": "十五世祖", "bio": "沛公次子。世袭侯爵，妣许氏，封夫人，生子二：厚、淳。", "tags": ["邓国（湖北襄樊）"], "children_names": ["厚", "淳"]}, {"seq": 43, "name": "淳公", "era": "西周", "rank": "十六世祖", "bio": "璧公次子。世袭侯爵，妣杨氏，封夫人，生子三：衡、峻、峰。", "tags": ["东周春秋战国\n（公元前770-前221年）", "邓国（湖北襄樊）"], "children_names": ["衡", "峻", "峰"]}, {"seq": 44, "name": "衡公", "era": "西周", "rank": "十七世祖", "bio": "淳公长子。世袭侯爵，妣曾氏，封夫人，生子二：伟、略。继配夫人，生子： 猷。", "tags": ["邓国（湖北襄樊）"], "children_names": ["伟", "略"]}, {"seq": 45, "name": "略公", "era": "西周", "rank": "十八世祖", "bio": "衡公次子。世袭侯爵，妣李氏，封夫人，生子二：宣、殷。", "tags": ["邓国（湖北襄樊）"], "children_names": ["宣", "殷"]}, {"seq": 46, "name": "宣公（吾离）", "era": "邓国（湖北襄樊）", "rank": "十九世祖", "bio": "到了春秋早期，邓国依然非常活跃，曾与郑国、鲁国、楚国等诸侯大国保持有婚姻往来。例如在史籍《春秋·桓公七年》中就记载，邓侯曼吾离曾于周桓王姬林十六年(公元前704年)千里迢迢到鲁国访问，拜访鲁桓公姬允(姬轨)。", "tags": ["东周：春秋（公元前770年至公元前476年）", "宣公"], "children_names": ["尚", "高", "敦"]}, {"seq": 47, "name": "尚公", "era": "东周：春秋", "rank": "二十世祖", "bio": "但是到了周桓王十七年(楚武王三十八年，公元前703年)，楚武王派往邓国的使者道朔和另一名巴国使者在邓国南境遭到了邻国人袭击，财物被掠，人也被诛杀。楚武王闻讯后大怒，派斗廉联络了巴国，之后率领楚、巴联军攻打邻国，邓侯知道后则派了养甥和聃甥率军", "tags": ["邓国（湖北襄樊）"], "children_names": []}, {"seq": 48, "name": "粹公", "era": "东周：春秋", "rank": "二十一世祖", "bio": "尚公长子。仍袭侯爵，妣苏氏，封夫人，生子二：明渊、明德。", "tags": ["邓国（湖北襄樊）"], "children_names": ["明渊", "明德"]}, {"seq": 49, "name": "明渊公（邓祁侯）", "era": "东周：春秋", "rank": "二十二世祖", "bio": "周庄王姬佗九年(楚文王熊赀二年，公元前688年)，楚文王亲率大军讨伐申国，需要通过经过娘舅家邓国。当时，邓国有三位上大夫皆提出应借机杀掉雄心勃勃的楚文王，以免后患。然而邓祈候子略却不以为然，他认为楚文王是自己的外甥，肯定不会对邓国不利，遂不", "tags": ["邓国被楚国合并，被迁楚都郢一带（湖北省荆州市）", "楚国吞并邓国，公元前678年", "明渊公"], "children_names": []}, {"seq": 50, "name": "史公", "era": "东周：春秋", "rank": "二十三世祖", "bio": "", "tags": ["明渊之子。妣伍氏，生子二：和、育。"], "children_names": []}, {"seq": 51, "name": "和公", "era": "东周：春秋", "rank": "二十四世祖", "bio": "", "tags": ["史公长子。妣田氏，生子二：耀、彩。"], "children_names": []}, {"seq": 52, "name": "耀公", "era": "东周：春秋", "rank": "二十五世祖", "bio": "", "tags": ["和公长子。妣郑氏，封夫人，生子二：侃、訚。"], "children_names": []}, {"seq": 53, "name": "侃公", "era": "东周：春秋", "rank": "二十六世祖", "bio": "耀公长子。春秋周景王时为徐州刺史。妣田氏，封宜人，生子二：彧、质。", "tags": ["徐州刺史"], "children_names": ["彧", "质"]}, {"seq": 54, "name": "彧公", "era": "东周：春秋", "rank": "二十七世祖", "bio": "", "tags": ["侃公长子。妣焦氏，生子：晃。"], "children_names": []}, {"seq": 55, "name": "晃公", "era": "东周：春秋", "rank": "二十八世祖", "bio": "彧公之子。妣黄氏，生子二：华、萼。妣方氏，生子二萃、萱", "tags": [], "children_names": ["华", "萼"]}, {"seq": 56, "name": "萼公", "era": "东周：春秋", "rank": "二十九世祖", "bio": "", "tags": ["晃公次子。妣黄氏，生子二：监、新。"], "children_names": []}, {"seq": 57, "name": "监公", "era": "晋阳县令", "rank": "三十世祖", "bio": "萼公长子。战国周烈王时任晋阳县令。妣徐氏，封宜人，生子二：愉、恺。", "tags": ["东周：战国（公元前475年—公元前221年）"], "children_names": ["愉", "恺"]}, {"seq": 58, "name": "恺公", "era": "东周：战国", "rank": "三十一世祖", "bio": "", "tags": ["监公次子。妣黄氏，生子二：安国、定国。"], "children_names": []}, {"seq": 59, "name": "安国公", "era": "东周：战国", "rank": "三十二世祖", "bio": "恺公长子。战国周显王时任南城宰，妣刘氏，生子三：襄、勋、瑚。", "tags": [], "children_names": ["襄", "勋", "瑚"]}, {"seq": 60, "name": "襄公", "era": "东周：战国", "rank": "三十三世祖", "bio": "", "tags": ["安国公长子。妣吕氏，生子二：沧、海。"], "children_names": []}, {"seq": 61, "name": "沧公", "era": "东周：战国", "rank": "三十四世祖", "bio": "襄公长子。战国周慎靓王时任直隶州牧。妣刘氏，封宜人，生子二：铭、钊。", "tags": [], "children_names": ["铭", "钊"]}, {"seq": 62, "name": "铭公", "era": "东周：战国", "rank": "三十五世祖", "bio": "沧公长子。战国周赧王时任州刺史，世居河北，隆师重道，乐善好施，卓有古风。妣王氏，生子二：文仲、敬仲。二子俱以文学著名，长子文仲为河东县令，遂称河东邓氏。", "tags": [], "children_names": ["文仲", "敬仲"]}, {"seq": 63, "name": "文仲公", "era": "东周：战国", "rank": "三十六世祖", "bio": "铭公长子。东周战国周赧王时为河东县令，卓著勋绩，从这以后便以河东而居，遂称河东邓氏。妣郑氏，封儒人， 生子：灏（hao）平、澍（shu）平。", "tags": ["东周河东邓氏世系"], "children_names": ["灏平", "澍平"]}, {"seq": 64, "name": "澋平公", "era": "东周：战国", "rank": "三十七世祖", "bio": "", "tags": ["文仲公长子。妣王氏，生子二：缙光、绅光。"], "children_names": []}, {"seq": 65, "name": "缙光公", "era": "秦朝", "rank": "三十八世祖", "bio": "考：上列七世至三十八世祖，起自西周武王乙未年，迄于东周烈王喜七年壬子（公元前1046-前369年，即秦献公十六年）为秦所灭，共32世，677年。周末战国时期秦六国为：韩、赵、魏、楚、燕、齐。自赧王五十九年（己巳、前256年）即秦昭襄王五十年", "tags": ["秦时为陵州刺史。妣郑氏，封宜人，生子：成，"], "children_names": []}, {"seq": 66, "name": "成公", "era": "秦朝", "rank": "三十九世祖", "bio": "缙光公之子。秦时任沧州刺史。妣冯氏，封宜人，生子二：玢、玠。", "tags": ["秦朝\n（公元前221-207年）"], "children_names": ["玢", "玠"]}, {"seq": 67, "name": "玠公", "era": "秦朝", "rank": "四十世祖", "bio": "考：上列三十九世至四十世，起自秦始皇庚辰，迄于秦三世子婴甲午（公元前221-前207年），共三王，十五年。乙未（前206年）子婴降于沛公刘邦而秦亡，即汉高祖元年。西楚霸王项羽与刘邦在战争，史称“楚汉之争”，起自公元前206年乙未，迄于公元前", "tags": ["成公次子。妣陈氏，生子二：敏、敬。"], "children_names": []}, {"seq": 68, "name": "敏公", "era": "西汉", "rank": "四十一世祖", "bio": "玠公长子。汉高祖时任中书大夫。妣黄氏，封夫人，生子二：通、远。邓通，西汉蜀郡南安人，本以行船为生，人称黄头郎。据传，汉文帝夜梦有黄头郎推他上天见玉帝，然后派人找到了邓通，两人相见恨晚。因此，邓通深得文帝宠幸，官至上大夫。汉文帝赐给邓通严道铜", "tags": ["西汉时期邓氏世系\n（公元前206-公元8年）"], "children_names": ["通", "远"]}, {"seq": 69, "name": "远公", "era": "西汉", "rank": "四十二世祖", "bio": "", "tags": ["敏公次子。妣孙氏，生子二：奎、光。"], "children_names": []}, {"seq": 70, "name": "奎公", "era": "西汉", "rank": "四十三世祖", "bio": "", "tags": ["远公长子。妣王氏，生子二：广汉、钦汉。"], "children_names": []}, {"seq": 71, "name": "广汉公", "era": "西汉", "rank": "四十四世祖", "bio": "奎公长子。汉宣帝时为中丞大夫。妣刘氏，封夫人，生子三：锦、环、球。", "tags": [], "children_names": ["锦", "环", "球"]}, {"seq": 72, "name": "锦公", "era": "西汉", "rank": "四十五世祖", "bio": "", "tags": ["广汉公长子。妣蔡氏，生子二：旭、明。"], "children_names": []}, {"seq": 73, "name": "明公", "era": "东汉", "rank": "四十六世祖", "bio": "锦公次子。汉平帝时为御史，生于汉成帝鸿嘉四年甲辰（公元前17年），在更始元年癸未（公元23年）开关迎接汉兵，辅佐刘秀。妣余氏，封夫人，生子二：禹、晔。", "tags": [], "children_names": ["禹", "晔"]}, {"seq": 74, "name": "禹公", "era": "东汉", "rank": "四十七世祖", "bio": "字仲华，生于西汉平帝元始二年壬戌，卒于东汉承平元年戊午（公元2年-58年）享年五十七岁。公十三岁时，受业长安，与光武遂相亲附，及汉兵起，会光武于河北，杖策追随平莽，建立东汉王朝。建武元年（公元25年），禹时年二十四，拜为大司徒，授前将军，封", "tags": ["东汉河南邓氏世系\n（公元25-220年）", "河南南阳新野县（襄阳古城县东北）"], "children_names": []}, {"seq": 75, "name": "训公", "era": "东汉", "rank": "二世", "bio": "六子训，字平叔，为扩羌校尉，妣耿氏。生子五：骘(zhi)、京、悝、弘、阊(chang)。有女绥皇后，垂帘听政第一人", "tags": [], "children_names": ["骘", "京", "悝", "弘", "阊"]}, {"seq": 76, "name": "骘", "era": "东汉", "rank": "三世", "bio": "", "tags": ["字昭阳，少辟大将军，上落侯", "绥"], "children_names": []}, {"seq": 77, "name": "凤", "era": "东汉", "rank": "四世", "bio": "", "tags": ["迁徙陕西"], "children_names": []}, {"seq": 78, "name": "学智", "era": "东汉", "rank": "五世", "bio": "", "tags": [], "children_names": []}, {"seq": 79, "name": "令伯", "era": "东汉", "rank": "六世", "bio": "", "tags": [], "children_names": []}, {"seq": 80, "name": "世安", "era": "东汉", "rank": "七世", "bio": "", "tags": [], "children_names": []}, {"seq": 81, "name": "展", "era": "汉献帝", "rank": "八世", "bio": "", "tags": ["次子，汉献帝九年官拜奋武大将军"], "children_names": []}, {"seq": 82, "name": "芝", "era": "后汉", "rank": "九世", "bio": "", "tags": ["字伯苗，大将军，后汉建兴中官，拜尚书，刘备；", "蜀国封侯"], "children_names": []}, {"seq": 83, "name": "玉清", "era": "三国", "rank": "十世", "bio": "", "tags": ["魏破蜀，邓玉清隐居陈郡（河南大康等地）"], "children_names": []}, {"seq": 84, "name": "嶽", "era": "晋", "rank": "十一世", "bio": "", "tags": ["广州刺史，追封成伯侯，兄长瑕迁江西吉州泰和县。"], "children_names": []}, {"seq": 85, "name": "世遐", "era": "晋", "rank": "十二世", "bio": "除寇大将军，瑕公为避免战乱，后迁至江西吉州太和县六十四都早禾寺鹅田梅子坡", "tags": [], "children_names": []}, {"seq": 86, "name": "羌", "era": "十六国隋秦", "rank": "十三世", "bio": "", "tags": ["秦苻坚车骑将军"], "children_names": []}, {"seq": 87, "name": "翼", "era": "燕", "rank": "十四世", "bio": "", "tags": ["燕河间太守"], "childre <script>
/* =========================================================
   DATA
   ========================================================= */
const TD = JSON.parse(document.getElementById('td').textContent);

// Build lookup
const bySeq = {};
TD.forEach(r => bySeq[r.seq] = r);

// Determine main-line seqs (1..147)
const mainSeqs = new Set(TD.map(r => r.seq));

// Build effective children for each seq:
// children_names from bio → match to known seqs within ±5 range
function resolveChildren(r) {
  const names = r.children_names || [];
  if (!names.length) return [];
  const nextSeq = r.seq + 1;
  const nextNode = bySeq[nextSeq];
  // First child is typically the main-line inheritor (nextSeq)
  // Other names are side branches (not separately in our data)
  return names.map((name, idx) => {
    if (idx === 0 && nextNode) {
      // Check if first child name matches next seq
      const nm = nextNode.name.replace(/公$/, '').replace(/（.*）/, '');
      if (nm.includes(name) || name.includes(nm) || name === nm) {
        return { seq: nextSeq, name, isMain: true };
      }
    }
    // Side branch: fabricate a ghost node
    return { seq: null, name, isMain: false };
  });
}

/* =========================================================
   LAYOUT CONFIG
   ========================================================= */
const NW = 90, NH = 108;   // node width / height
const HGAP = 28;            // horizontal gap between siblings
const VGAP = 70;            // vertical gap between generations
const LEFT_PAD = 50;        // left label area
const TOP_PAD = 52;

/* =========================================================
   NODE PLACEMENT
   We lay out in HORIZONTAL TREE style:
   - Each generation = one row (y level)
   - Main line nodes form a left spine
   - Children branch horizontally within their row
   - The key insight: we compute x by counting siblings
   ========================================================= */

let placedNodes = [];   // {id, x, y, seq, name, era, rank, bio, tags, isMain, isSide, ghostName}
let edges = [];         // {x1,y1,x2,y2,type}
let worldW = 0, worldH = 0;

function layout() {
  placedNodes = []; edges = [];
  let worldMaxX = 0, worldMaxY = 0;

  // We iterate generation by generation
  // For each main-line node, place it and its siblings horizontally
  // The "generation column" is the row
  
  // Track x cursor per row (to avoid overlapping)
  // We'll do a two-pass: first figure out how many siblings each gen has, then place

  // Simpler approach: for each seq in order, place main node, then side nodes to the right
  // Parent connector goes UP to previous gen's main node

  let prevMainX = LEFT_PAD + 20;  // x of previous generation's main node
  const prevMainY = {};

  for (let i = 0; i < TD.length; i++) {
    const r = TD[i];
    const gen = i;  // generation index
    const y = TOP_PAD + gen * (NH + VGAP);
    
    // Main node x: align with parent if possible, else continue from last
    const mx = LEFT_PAD + 20;
    const my = y;

    const mainId = 'ml_' + r.seq;
    placedNodes.push({
      id: mainId,
      x: mx, y: my,
      seq: r.seq, name: r.name, era: r.era,
      rank: r.rank, bio: r.bio, tags: r.tags,
      isMain: true, isSide: false,
    });

    // Vertical edge from previous generation main
    if (i > 0) {
      const prevSeq = TD[i-1].seq;
      const prevY = TOP_PAD + (i-1) * (NH + VGAP);
      edges.push({
        x1: mx + NW/2, y1: prevY + NH,
        x2: mx + NW/2, y2: my,
        type: 'main'
      });
    }

    // Side children
    const children = resolveChildren(r);
    if (children.length > 1) {
      // Side siblings start at mx + NW + HGAP
      let sx = mx + NW + HGAP;
      const sideChildren = children.slice(1);  // skip main-line first child
      
      // Horizontal connector bar at top of this generation
      const barY = my + NH * 0.22;
      
      for (const child of sideChildren) {
        const sid = 'side_' + r.seq + '_' + child.name;
        placedNodes.push({
          id: sid,
          x: sx, y: my,
          seq: child.seq, name: child.name, era: r.era,
          rank: '', bio: '', tags: [],
          isMain: false, isSide: true,
          ghostName: child.name,
        });
        
        // Edge: horizontal dash from main to side
        edges.push({
          x1: mx + NW, y1: barY,
          x2: sx + NW/2, y2: barY,
          type: 'hbar'
        });
        edges.push({
          x1: sx + NW/2, y1: barY,
          x2: sx + NW/2, y2: my,
          type: 'sdrop'
        });

        if (sx + NW > worldMaxX) worldMaxX = sx + NW;
        sx += NW + HGAP;
      }
    }

    if (mx + NW > worldMaxX) worldMaxX = mx + NW;
    if (my + NH > worldMaxY) worldMaxY = my + NH;
  }

  worldW = worldMaxX + 120;
  worldH = worldMaxY + 80;
}

/* =========================================================
   ERA COLORS
   ========================================================= */
const ERA_COLORS = {
  '商':'#8b4513','西周':'#5c4a2a','东周':'#4a5c2a',
  '战国':'#2a4a5c','秦':'#5c2a2a','西汉':'#2a5c4a',
  '东汉':'#a3312a','三国':'#5c3a2a','晋':'#3a4a5c',
  '唐':'#8a6a33','宋':'#3f5c4c','明':'#5c4a8a',
  '清':'#3a5c8a','新中国':'#2a5c3a','改革':'#3a3a5c',
};
function eraColor(era) {
  if (!era) return '#888';
  for (const [k,v] of Object.entries(ERA_COLORS)) if (era.includes(k)) return v;
  return '#888';
}
function eraShort(era) { return (era||'').split(/[（(]/)[0].trim(); }
function esc(s) { return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =========================================================
   RENDER
   ========================================================= */
const world = document.getElementById('world');
const svgEl = document.getElementById('svg-layer');

function render() {
  layout();

  world.style.width  = worldW + 'px';
  world.style.height = worldH + 'px';
  svgEl.setAttribute('width', worldW);
  svgEl.setAttribute('height', worldH);
  svgEl.style.width  = worldW + 'px';
  svgEl.style.height = worldH + 'px';

  // SVG edges
  let svgPaths = '';
  for (const e of edges) {
    if (e.type === 'main') {
      const cy = (e.y1 + e.y2) / 2;
      svgPaths += `<path d="M${e.x1},${e.y1} C${e.x1},${cy} ${e.x2},${cy} ${e.x2},${e.y2}"
        stroke="#c3a96f" stroke-width="1.8" fill="none" opacity=".75"/>`;
    } else if (e.type === 'hbar') {
      svgPaths += `<line x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}"
        stroke="#c3a96f" stroke-width="1" opacity=".5" stroke-dasharray="5,3"/>`;
    } else if (e.type === 'sdrop') {
      svgPaths += `<line x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}"
        stroke="#c3a96f" stroke-width="1" opacity=".4" stroke-dasharray="3,3"/>`;
    }
  }
  svgEl.innerHTML = svgPaths;

  // Remove old nodes
  world.querySelectorAll('.node,.glabel').forEach(el => el.remove());

  // Era generation labels on left
  const seenEras = new Set();
  for (const n of placedNodes) {
    if (!n.isMain) continue;
    const el = eraShort(n.era);
    if (!el || seenEras.has(el)) continue;
    seenEras.add(el);
    const lbl = document.createElement('div');
    lbl.className = 'glabel';
    lbl.textContent = el;
    lbl.style.left = '4px';
    lbl.style.top  = (n.y + 20) + 'px';
    lbl.style.height = (NH - 10) + 'px';
    lbl.style.color = eraColor(n.era);
    world.appendChild(lbl);
  }

  // Nodes
  for (const n of placedNodes) {
    const color = eraColor(n.era);
    const el = document.createElement('div');
    el.className = 'node' + (n.isMain ? ' ml' : '');
    el.id = n.id;
    el.style.left = n.x + 'px';
    el.style.top  = n.y + 'px';
    el.setAttribute('data-seq', n.seq || '');
    el.setAttribute('data-name', n.name || '');

    const rankBadge = (n.rank && !n.isSide)
      ? `<div class="nrank">${esc(n.rank)}</div>` : '';
    const seqBadge = n.seq
      ? `<div class="nseq">${n.seq}世</div>` : '';
    const avatarStyle = n.isMain ? `border-color:${color};` : '';
    const cardStyle   = n.isMain ? `border-color:${color};` : '';

    el.innerHTML = `
      <div class="avatar" style="${avatarStyle}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <div class="ncard" style="${cardStyle}">
        ${rankBadge}
        <div class="nname">${esc(n.name)}</div>
        <div class="nera">${esc(eraShort(n.era))}</div>
        ${seqBadge}
      </div>`;

    el.addEventListener('click', () => showDetail(n));
    world.appendChild(el);
  }
}

/* =========================================================
   DETAIL PANEL
   ========================================================= */
function showDetail(n) {
  document.querySelectorAll('.node').forEach(el => el.classList.remove('highlighted'));
  const el = document.getElementById(n.id);
  if (el) { el.classList.add('highlighted'); scrollToNode(n); }

  const color = eraColor(n.era);
  const tags = (n.tags || []).filter(t => t && t.length > 1 && t.length < 35);
  document.getElementById('dp-body').innerHTML = `
    <div class="dp-seq">第 ${n.seq || '—'} 代${n.isSide ? ' · 旁支' : ''}</div>
    <div class="dp-name">${esc(n.name)}</div>
    <div class="dp-rank">${esc(n.rank || '')}</div>
    <div class="dp-era" style="background:${color}">${esc(n.era || '')}</div>
    ${tags.length ? `<div class="dp-sect"><div class="dp-stitle">地域 · 关联</div>
      ${tags.map(t => `<span class="dp-tag">${esc(t)}</span>`).join('')}
    </div>` : ''}
    ${n.bio ? `<div class="dp-sect"><div class="dp-stitle">人物简介</div>
      <div class="dp-bio">${esc(n.bio)}${n.bio.length >= 120 ? '…' : ''}</div>
    </div>` : '<div class="dp-bio" style="color:#bbb;padding-top:8px;">谱中暂无详细记载。</div>'}
  `;
  document.getElementById('dp').classList.add('open');
}

function closePanel() {
  document.getElementById('dp').classList.remove('open');
  document.querySelectorAll('.node').forEach(el => el.classList.remove('highlighted'));
}

function scrollToNode(n) {
  const canvas = document.getElementById('canvas');
  const x = n.x * scale - canvas.offsetWidth / 2 + NW * scale / 2;
  const y = n.y * scale - canvas.offsetHeight / 2 + NH * scale / 2;
  canvas.scrollTo({ left: Math.max(0,x), top: Math.max(0,y), behavior: 'smooth' });
}

/* =========================================================
   ERA FILTER
   ========================================================= */
const ERAS = ['商朝','西周','东周','秦朝','西汉','东汉','三国','晋','唐','宋','明朝','清朝','新中国'];
let activeEra = null;

(function buildPills() {
  const c = document.getElementById('epills');
  c.innerHTML = ERAS.map(e =>
    `<span class="epill" data-era="${e}" onclick="filterEra('${e}')">${e}</span>`
  ).join('');
})();

function filterEra(era) {
  if (activeEra === era) {
    activeEra = null;
    document.querySelectorAll('.epill').forEach(p => p.classList.remove('on'));
    document.querySelectorAll('.node').forEach(el => el.classList.remove('dimmed'));
    return;
  }
  activeEra = era;
  document.querySelectorAll('.epill').forEach(p => p.classList.toggle('on', p.dataset.era === era));
  document.querySelectorAll('.node').forEach(el => {
    const seq = parseInt(el.dataset.seq);
    const rec = bySeq[seq];
    const hit = rec && rec.era && rec.era.includes(era);
    el.classList.toggle('dimmed', !hit && !!seq);
  });
  // Scroll to first match
  const first = placedNodes.find(n => n.isMain && (n.era||'').includes(era));
  if (first) scrollToNode(first);
}

/* =========================================================
   SEARCH
   ========================================================= */
function doSearch(q) {
  if (!q.trim()) {
    document.querySelectorAll('.node').forEach(el => el.classList.remove('dimmed'));
    return;
  }
  document.querySelectorAll('.node').forEach(el => {
    const name = el.dataset.name || '';
    const hit = name.includes(q);
    el.classList.toggle('dimmed', !hit);
    if (hit) {
      const id = el.id;
      const n = placedNodes.find(n => n.id === id);
      if (n) { el.classList.remove('dimmed'); scrollToNode(n); }
    }
  });
}

/* =========================================================
   PAN + ZOOM
   ========================================================= */
const canvas = document.getElementById('canvas');
let scale = 1.0;
let isPan = false, panSX = 0, panSY = 0, panMX = 0, panMY = 0;

canvas.addEventListener('mousedown', e => {
  const tag = e.target.tagName.toLowerCase();
  if (tag === 'input' || tag === 'button' || tag === 'a') return;
  if (!e.target.closest('.node') && !e.target.closest('#dp')) {
    isPan = true;
    canvas.classList.add('grabbing');
    panMX = e.clientX; panMY = e.clientY;
    panSX = canvas.scrollLeft; panSY = canvas.scrollTop;
  }
});
window.addEventListener('mousemove', e => {
  if (!isPan) return;
  canvas.scrollLeft = panSX - (e.clientX - panMX);
  canvas.scrollTop  = panSY - (e.clientY - panMY);
});
window.addEventListener('mouseup', () => { isPan = false; canvas.classList.remove('grabbing'); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  doZoom(e.deltaY < 0 ? 1.1 : 0.91);
}, { passive: false });

function doZoom(f) {
  scale = Math.min(2.5, Math.max(0.15, scale * f));
  world.style.transform = `scale(${scale})`;
  world.style.transformOrigin = '0 0';
}

// Touch pinch
let t0dist = null, t0scale = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    t0dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    t0scale = scale;
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && t0dist) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    scale = Math.min(2.5, Math.max(0.15, t0scale * (d / t0dist)));
    world.style.transform = `scale(${scale})`;
    world.style.transformOrigin = '0 0';
  }
}, { passive: true });

function resetView() {
  scale = 0.88;
  world.style.transform = `scale(${scale})`;
  world.style.transformOrigin = '0 0';
  canvas.scrollTo(0, 0);
  closePanel();
  document.querySelectorAll('.node').forEach(el => el.classList.remove('dimmed','highlighted'));
  document.querySelectorAll('.epill').forEach(p => p.classList.remove('on'));
  document.getElementById('sinput').value = '';
  activeEra = null;
}

/* =========================================================
   INIT
   ========================================================= */
render();
resetView();
</script>
